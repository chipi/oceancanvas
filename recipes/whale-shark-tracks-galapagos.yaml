name: whale-shark-tracks-galapagos
title: Whale shark — Eastern Pacific threads
description: >
  Zoomed into the eastern Pacific, where the cold Humboldt Current meets
  the warm Panama Current and large pregnant females pass through. Each
  research dataset's chronologically-ordered sightings becomes a thread
  in the arctic palette — cool blues and ice-whites against the deep
  navy. The stitching here is what tells the story; how researchers'
  observation effort traces the animals' realm.
created: 2026-05-07
author: chipi
region:
  lat: [-15, 15]
  lon: [-120, -65]
  name: Eastern Pacific
sources:
  primary: obis-whale-shark
  context: gebco
schedule: daily

