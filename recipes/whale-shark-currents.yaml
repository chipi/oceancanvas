name: whale-shark-currents
title: Whale shark — animals as ocean sensors
description: >
  The same trick gulf-stream-thermal pulls with SST gradients, but with
  whale-shark positions instead. Each research dataset's sightings,
  ordered chronologically, becomes a coloured thread — the head bright,
  the tail fading. The image is a portrait of the ocean's structure as
  read by the animals themselves: where they cluster reveals upwelling
  fronts, where they line up reveals currents the satellites can't see.
created: 2026-05-04
author: chipi
region:
  lat: [-40, 40]
  lon: [-180, 180]
  name: Global tropics
sources:
  primary: obis-whale-shark
  context: gebco
schedule: daily

# ⊓ creative controls ⊓
render:
  type: particles
  source_mode: tracks                  # ADR-031 — per-dataset point archives, not gridded flow
  colormap: thermal
  opacity: 0.85
  seed: 73
audio:
  drone_waveform: triangle
  drone_glide: 0.55
  pulse_sensitivity: 0.5
  presence: 0.7
  accent_style: ping
  texture_density: 0.3
tension_arc:
  preset: classic
  peak_position: 0.7
  peak_height: 1.0
  release_steepness: 0.6
  pin_key_moment: true
