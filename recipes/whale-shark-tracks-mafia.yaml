name: whale-shark-tracks-mafia
title: Whale shark — Mafia, the East African collision
description: >
  Zoomed into the western Indian Ocean — Mafia Island, the Mozambique
  Channel, the East African shelf. The Agulhas Current sweeps warm
  water past upwelling zones; whale sharks gather. Each research
  dataset's sightings become a thread in the otherworldly palette —
  cyan and green-white against dark navy, the colours of an exotic
  ocean reading itself.
