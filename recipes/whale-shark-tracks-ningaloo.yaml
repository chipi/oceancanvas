name: whale-shark-tracks-ningaloo
title: Whale shark — Ningaloo, the Australian warmth
description: >
  Zoomed into the Indian Ocean's eastern edge — the Ningaloo Reef coast
  and the Indo-Pacific belt around it. Forty years of sightings sorted
  chronologically by research dataset, drawn as warm-palette threads
  against deep navy. The thermal colormap reflects the Indian Ocean's
  warm tongues that pull the sharks along the Australian shelf each
  March through July.
