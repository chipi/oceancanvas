name: whale-shark-density
title: Whale shark — fifty years, one image
description: >
  Every recorded whale-shark sighting since the 1970s, binned into a half-degree
  grid and rendered as a single thermal heatfield. Bright cells are the
  aggregation realms — Mafia Island, Ningaloo, Galápagos, Yucatán — burned
  into one image. Sparse points become a continuous field; the species'
  realm becomes legible at a glance.
created: 2026-05-07
author: chipi
region:
  lat: [-40, 40]
  lon: [-180, 180]
  name: Global tropics
sources:
  primary: obis-whale-shark
  context: gebco
schedule: daily

# ⊓ creative controls ⊓
render:
  type: field
  aggregate: density                   # ADR-030 — bin point sources to 2D grid before render
  resolution: 1.0                      # 1° cells (~110km at equator) — readable size at 1920x1080
  colormap: thermal
  opacity: 1.0
  smooth: false                        # sharp cell edges — data-side box blur (in process_obis_density) gives the colour richness; this drops bilinear scaling so tiles read crisp
  log_scale: true                      # density distribution is long-tailed — log keeps medium cells legible
  tail_length: 8                       # mid contrast over the log-scaled values
  speed_scale: 1.2                     # slight brightness lift
  seed: 50
audio:
  drone_waveform: triangle
  drone_glide: 0.5
  pulse_sensitivity: 0.4
  presence: 0.7
  accent_style: bell
  texture_density: 0.35
tension_arc:
  preset: classic
  peak_position: 0.6
  peak_height: 0.95
  release_steepness: 0.55
  pin_key_moment: false
