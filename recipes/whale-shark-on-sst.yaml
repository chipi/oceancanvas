name: whale-shark-on-sst
title: Whale shark — reading the ocean
description: >
  The most direct biological story in the catalog. SST as the background
  field; whale-shark observations as scatter dots overlaid on top, showing
  where the animals chose to be. Whale sharks aggregate along the 28°C
  isotherm, avoid the cold tongues, move with the seasons. The image is
  the species reading the ocean's temperature.
created: 2026-05-04
author: chipi
region:
  lat: [-40, 40]
  lon: [-180, 180]
  name: Global tropics
sources:
  primary: oisst                       # the field underneath
  foreground: obis-whale-shark         # the dots on top
  context: gebco
schedule: daily

# ⊓ creative controls ⊓
render:
  type: composite
  colormap: thermal
  opacity: 0.95                        # let the SST field carry its own weight
  smooth: true
  tail_length: 16                      # high-contrast gamma — fronts and isotherms read sharper
  speed_scale: 1.1                     # slight brightness lift, push the warm tongue
  seed: 28
  foreground_colormap: otherworldly    # cyan/white dots — high-contrast against the saturated thermal
  foreground_marker_size: 10           # bigger so they register against the rich field
  foreground_marker_opacity: 1.0
audio:
  drone_waveform: triangle
  drone_glide: 0.6
  pulse_sensitivity: 0.45
  presence: 0.75
  accent_style: bell
  texture_density: 0.35
tension_arc:
  preset: classic
  peak_position: 0.65
  peak_height: 0.95
  release_steepness: 0.55
  pin_key_moment: true
