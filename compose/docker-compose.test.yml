# Synthetic-data e2e stack (ADR-014). Shares the project name with
# docker-compose.yml (CI builds once and runs with --no-build). A Model-B
# checkout overrides the name via the generated compose/.env.
#
# Nothing here is published to the host: the e2e container reaches the gallery
# over the Compose network (http://gallery:8080), so two checkouts can run
# `make e2e` at the same time.
name: oceancanvas

services:
  pipeline:
    build:
      context: ..
      dockerfile: pipeline/Dockerfile
    environment:
      PREFECT_API_URL: ""
    volumes:
      - ../pipeline/tests/fixtures/oisst:/data/sources/oisst
      - ../pipeline/tests/fixtures/argo:/data/sources/argo
      - ../pipeline/tests/fixtures/gebco:/data/gebco
      - ../pipeline/tests/fixtures/recipes:/recipes
      - test-processed:/data/processed
      - test-renders:/renders
      - ../sketches:/sketches:ro
    command: python -m oceancanvas.flow --test-mode

  recipe-server:
    image: node:20-slim
    init: true  # node as PID 1 ignores SIGTERM; without an init, stop waits 10 s then SIGKILLs
    working_dir: /app
    command: node server/save-recipe.mjs
    environment:
      RECIPES_DIR: /recipes
      SAVE_PORT: "3001"
    volumes:
      - ../gallery/server:/app/server:ro
      - ../pipeline/tests/fixtures/recipes:/recipes

  gallery:
    build: ../gallery
    environment:
      RECIPE_SERVER: recipe-server:3001
    volumes:
      - test-processed:/data/processed:ro
      - test-renders:/renders:ro
      - ../pipeline/tests/fixtures/recipes:/recipes:ro
      - ../sketches:/sketches:ro
    depends_on:
      pipeline:
        condition: service_completed_successfully
      recipe-server:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080"]
      interval: 5s
      timeout: 3s
      retries: 10

  e2e:
    build: ../e2e
    depends_on:
      gallery:
        condition: service_healthy
    command: npx playwright test

volumes:
  test-processed:
  test-renders:
