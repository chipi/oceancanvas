name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Lint pipeline
        run: cd pipeline && uv sync --extra dev && uv run ruff check src/ tests/ && uv run ruff format --check src/ tests/
      - name: Lint gallery
        run: cd gallery && npm ci && npm run lint

  test-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Unit + integration tests
        run: cd pipeline && uv sync --extra dev && uv run pytest tests/unit/ tests/integration/ -v

  test-gallery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: cd gallery && npm ci && npm test

  test-renderer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: cd pipeline/src/oceancanvas/renderer && npm ci && npm test

  e2e:
    runs-on: ubuntu-latest
    needs: [lint, test-pipeline, test-gallery, test-renderer]
    steps:
      - uses: actions/checkout@v4
      - name: Ensure .env exists for Compose validation
        run: test -f .env || cp .env.example .env
      # Prod stack (ADR-011) plus e2e image — same steps on PR and push to main.
      # Image tags match docker-compose.test.yml (same project name), so --no-build avoids rebuilding pipeline/gallery.
      - name: Validate Compose files
        run: docker compose config --quiet && docker compose -f docker-compose.test.yml config --quiet
      - name: Build Docker images
        run: |
          docker compose build
          docker compose -f docker-compose.test.yml build e2e
      - name: Run e2e stack
        run: docker compose -f docker-compose.test.yml up --no-build --abort-on-container-exit --exit-code-from e2e

  deploy-docs:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [e2e]
    permissions:
      contents: write
      pages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install MkDocs
        run: pip install -r docs/requirements.txt
      - name: Build docs
        run: mkdocs build --strict
      - name: Deploy to GitHub Pages
        run: mkdocs gh-deploy --force
